<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Towers</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #151820;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(95vw, 900px);
      text-align: center;
    }

    .top, .setup-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
    }

    input[type="color"] {
      padding: 3px;
      width: 52px;
      height: 42px;
    }

    button {
      cursor: pointer;
      background: #ffd166;
      color: #1b1b1b;
    }

    .setup-card {
      background: #202636;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .info {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .scores {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .score {
      padding: 8px 12px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      border: 2px solid white;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      background: #0b0d12;
      padding: 8px;
      border-radius: 16px;
      margin: 0 auto;
      width: min(92vw, 640px);
      aspect-ratio: 1 / 1;
    }

    .tile {
      position: relative;
      border-radius: 10px;
      border: 2px solid #2c3345;
      cursor: pointer;
      font-weight: bold;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .hidden {
      background: #ffffff;
      color: transparent;
      border-color: #e5e5e5;
    }

    .revealed {
      background: #2d3748;
      color: white;
    }

    .tower {
      color: white;
    }

    .tower-number {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      z-index: 1;
    }

    .progress-wrap {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 6px;
      height: 7px;
      background: rgba(255,255,255,0.35);
      border-radius: 999px;
      overflow: hidden;
      z-index: 3;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 999px;
    }

    .players {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
      flex-wrap: wrap;
      padding: 5px;
      z-index: 4;
    }

    .piece {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: white;
      text-shadow: 0 1px 2px black;
    }

    .note {
      color: #cbd5e1;
      margin-top: 14px;
      font-size: 14px;
    }

    .game-over {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 20;
      place-items: center;
      padding: 20px;
    }

    .game-over-box {
      background: #202636;
      border-radius: 22px;
      padding: 24px;
      width: min(95vw, 650px);
      border: 3px solid #ffd166;
    }

    .ranking {
      display: grid;
      gap: 10px;
      margin: 18px 0;
      text-align: left;
    }

    .rank-row {
      padding: 12px;
      border-radius: 14px;
      background: #151820;
      border: 2px solid #374151;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Hidden Towers</h1>

    <div class="setup-card" id="setupCard">
      <div class="setup-row">
        <select id="playerCount" onchange="buildPlayerInputs()">
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4">4 Players</option>
        </select>
        <button onclick="startGame()">Start Game</button>
      </div>

      <div id="playerInputs"></div>
    </div>

    <div class="top">
      <button onclick="stayTurn()">Stay</button>
      <button onclick="resetGame()">Reset</button>
    </div>

    <div class="info" id="info">Name players, pick colors, and start.</div>
    <div class="scores" id="scores"></div>
    <div class="board" id="board"></div>

    <div class="note">
      First to 5000 points or 4 towers wins. Click an adjacent square to move. Use Stay on a tower to level it up or capture it.
    </div>
  </div>

  <div class="game-over" id="gameOver">
    <div class="game-over-box">
      <h2 id="winnerTitle"></h2>
      <p id="winnerReason"></p>
      <div class="ranking" id="finalRanking"></div>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    const SIZE = 8;
    const TOWER_COUNT = 7;
    const MIN_DISTANCE = 5;
    const MAX_TOWER_LEVEL = 8;
    const POINTS_TO_WIN = 5000;
    const TOWERS_TO_WIN = Math.floor(TOWER_COUNT / 2) + 1;

    const DEFAULT_COLORS = ["#e03131", "#1971c2", "#2f9e44", "#9c36b5"];

    let tiles = [];
    let players = [];
    let currentPlayer = 0;
    let gameEnded = false;

    buildPlayerInputs();

    function buildPlayerInputs() {
      const count = Number(document.getElementById("playerCount").value);
      const box = document.getElementById("playerInputs");
      box.innerHTML = "";

      for (let i = 0; i < count; i++) {
        box.innerHTML += `
          <div class="setup-row">
            <input id="name${i}" value="Player ${i + 1}" maxlength="16">
            <input id="color${i}" type="color" value="${DEFAULT_COLORS[i]}">
          </div>
        `;
      }
    }

    function startGame() {
      const count = Number(document.getElementById("playerCount").value);

      tiles = [];
      players = [];
      currentPlayer = 0;
      gameEnded = false;

      document.getElementById("gameOver").style.display = "none";
      document.getElementById("setupCard").style.display = "none";

      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          tiles.push({
            x,
            y,
            revealed: false,
            type: "empty",
            owner: null,
            level: 1,
            ownerProgress: 0,
            invaderId: null,
            invaderProgress: 0
          });
        }
      }

      const starts = generateStartPositions(count);

      for (let i = 0; i < count; i++) {
        const name = document.getElementById(`name${i}`).value.trim() || `Player ${i + 1}`;
        const color = document.getElementById(`color${i}`).value;

        players.push({
          id: i,
          name,
          x: starts[i].x,
          y: starts[i].y,
          color,
          points: 0
        });

        getTile(starts[i].x, starts[i].y).revealed = true;
      }

      placeTowers(starts);
      render();
    }

    function generateStartPositions(count) {
      const positions = [];
      let attempts = 0;

      while (positions.length < count && attempts < 5000) {
        attempts++;

        const pos = {
          x: Math.floor(Math.random() * SIZE),
          y: Math.floor(Math.random() * SIZE)
        };

        const farEnough = positions.every(other => {
          return manhattan(pos, other) >= MIN_DISTANCE;
        });

        if (farEnough) positions.push(pos);
      }

      if (positions.length < count) {
        return [
          { x: 0, y: 0 },
          { x: 7, y: 7 },
          { x: 7, y: 0 },
          { x: 0, y: 7 }
        ].slice(0, count);
      }

      return positions;
    }

    function placeTowers(startPositions) {
      let placed = 0;

      while (placed < TOWER_COUNT) {
        const x = Math.floor(Math.random() * SIZE);
        const y = Math.floor(Math.random() * SIZE);

        const isStart = startPositions.some(pos => pos.x === x && pos.y === y);
        const tile = getTile(x, y);

        if (!isStart && tile.type !== "tower") {
          tile.type = "tower";
          placed++;
        }
      }
    }

    function render() {
      renderScores();
      renderBoard();

      if (players.length && !gameEnded) {
        document.getElementById("info").textContent = `${players[currentPlayer].name}'s turn`;
      } else if (!players.length) {
        document.getElementById("info").textContent = "Name players, pick colors, and start.";
      }
    }

    function renderScores() {
      const scores = document.getElementById("scores");
      scores.innerHTML = "";

      players.forEach(player => {
        const towers = countOwnedTowers(player.id);

        const div = document.createElement("div");
        div.className = "score";
        div.style.background = player.color;
        div.textContent = `${player.name}: ${player.points} pts | Towers: ${towers}`;
        scores.appendChild(div);
      });
    }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      for (const tile of tiles) {
        const tilePlayers = players.filter(p => p.x === tile.x && p.y === tile.y);

        const div = document.createElement("div");
        div.className = "tile ";

        if (!tile.revealed) {
          div.className += "hidden";
        } else if (tile.type === "tower") {
          div.className += "tower";
          div.style.background = tile.owner !== null ? players[tile.owner].color : "#7048e8";

          const towerNumber = document.createElement("div");
          towerNumber.className = "tower-number";
          towerNumber.textContent = tile.level;
          div.appendChild(towerNumber);

          const progressWrap = document.createElement("div");
          progressWrap.className = "progress-wrap";

          const progressBar = document.createElement("div");
          progressBar.className = "progress-bar";
          progressBar.style.width = getTowerProgressPercent(tile) + "%";

          progressWrap.appendChild(progressBar);
          div.appendChild(progressWrap);
        } else {
          div.className += "revealed";
        }

        div.onclick = () => moveTo(tile.x, tile.y);

        const playerLayer = document.createElement("div");
        playerLayer.className = "players";

        tilePlayers.forEach(p => {
          const piece = document.createElement("div");
          piece.className = "piece";
          piece.style.background = p.color;
          piece.textContent = p.name.charAt(0).toUpperCase();
          playerLayer.appendChild(piece);
        });

        div.appendChild(playerLayer);
        board.appendChild(div);
      }
    }

    function moveTo(x, y) {
  if (!players.length || gameEnded) return;
  if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
      const player = players[currentPlayer];

      if (!isAdjacent(player.x, player.y, x, y)) return;

      player.x = x;
      player.y = y;

      const tile = getTile(x, y);
      tile.revealed = true;

      handleTowerStep(player, tile, true);

      if (checkWinner(player)) return;

      nextTurn();
    }

    function stayTurn() {
      if (!players.length || gameEnded) return;

      const player = players[currentPlayer];
      const tile = getTile(player.x, player.y);

      tile.revealed = true;

      handleTowerStep(player, tile, false);

      if (checkWinner(player)) return;

      nextTurn();
    }

    function handleTowerStep(player, tile, justMovedOntoTile) {
      if (tile.type !== "tower") return;

      if (tile.owner === null) {
        tile.owner = player.id;
        tile.level = 1;
        tile.ownerProgress = 0;
        tile.invaderId = null;
        tile.invaderProgress = 0;
        player.points += pointsForTowerLevel(tile.level);
        return;
      }

      if (tile.owner === player.id) {
        tile.invaderId = null;
        tile.invaderProgress = 0;

        if (justMovedOntoTile) return;
        if (tile.level >= MAX_TOWER_LEVEL) return;

        tile.ownerProgress++;

        const needed = tile.level;

        if (tile.ownerProgress >= needed) {
          tile.level++;
          tile.ownerProgress = 0;
          player.points += pointsForTowerLevel(tile.level);
        }

        return;
      }

      tile.ownerProgress = 0;

      if (tile.invaderId !== player.id) {
        tile.invaderId = player.id;
        tile.invaderProgress = 0;
      }

      tile.invaderProgress++;

      if (tile.invaderProgress >= 5) {
        tile.owner = player.id;
        tile.invaderId = null;
        tile.invaderProgress = 0;
        tile.ownerProgress = 0;
        player.points += pointsForTowerLevel(tile.level);
      }
    }

    function pointsForTowerLevel(level) {
      return 50 + (level - 1) * 107;
    }

    function checkWinner(player) {
      const ownedTowers = countOwnedTowers(player.id);

      if (player.points >= POINTS_TO_WIN) {
        endGame(player, `${player.name} reached ${POINTS_TO_WIN} points.`);
        return true;
      }

      if (ownedTowers >= TOWERS_TO_WIN) {
        endGame(player, `${player.name} owns ${ownedTowers} of ${TOWER_COUNT} towers.`);
        return true;
      }

      return false;
    }

    function endGame(winner, reason) {
      gameEnded = true;
      render();

      document.getElementById("winnerTitle").textContent = `${winner.name} Wins!`;
      document.getElementById("winnerReason").textContent = reason;

      const ranking = [...players].sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        return countOwnedTowers(b.id) - countOwnedTowers(a.id);
      });

      const rankingBox = document.getElementById("finalRanking");
      rankingBox.innerHTML = "";

      ranking.forEach((player, index) => {
        const div = document.createElement("div");
        div.className = "rank-row";
        div.style.borderColor = player.color;

        div.innerHTML = `
          <strong>#${index + 1} ${player.name}</strong><br>
          Points: ${player.points}<br>
          Towers Owned: ${countOwnedTowers(player.id)}<br>
          Highest Tower: Level ${highestTowerLevel(player.id)}
        `;

        rankingBox.appendChild(div);
      });

      document.getElementById("gameOver").style.display = "grid";
    }

    function countOwnedTowers(playerId) {
      return tiles.filter(tile => tile.type === "tower" && tile.owner === playerId).length;
    }

    function highestTowerLevel(playerId) {
      const owned = tiles.filter(tile => tile.type === "tower" && tile.owner === playerId);

      if (!owned.length) return 0;

      return Math.max(...owned.map(tile => tile.level));
    }

    function getTowerProgressPercent(tile) {
      if (tile.owner === null) return 0;

      if (tile.invaderId !== null) {
        return Math.min(100, (tile.invaderProgress / 5) * 100);
      }

      if (tile.level >= MAX_TOWER_LEVEL) return 100;

      return Math.min(100, (tile.ownerProgress / tile.level) * 100);
    }

    function nextTurn() {
      currentPlayer++;
      if (currentPlayer >= players.length) currentPlayer = 0;
      render();
    }

    function isAdjacent(x1, y1, x2, y2) {
      const dx = Math.abs(x1 - x2);
      const dy = Math.abs(y1 - y2);
      return dx + dy === 1;
    }

    function getTile(x, y) {
      return tiles.find(tile => tile.x === x && tile.y === y);
    }

    function manhattan(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    function resetGame() {
      tiles = [];
      players = [];
      currentPlayer = 0;
      gameEnded = false;

      document.getElementById("board").innerHTML = "";
      document.getElementById("scores").innerHTML = "";
      document.getElementById("info").textContent = "Name players, pick colors, and start.";
      document.getElementById("gameOver").style.display = "none";
      document.getElementById("setupCard").style.display = "block";

      buildPlayerInputs();
    }

    let resetPressCount = 0;
let resetTimer = null;

document.addEventListener("keydown", function(event) {
  if (!players.length || gameEnded) return;

  const key = event.key.toLowerCase();
  const player = players[currentPlayer];

  if (key === "arrowup") {
    moveTo(player.x, player.y - 1);
  }

  if (key === "arrowdown") {
    moveTo(player.x, player.y + 1);
  }

  if (key === "arrowleft") {
    moveTo(player.x - 1, player.y);
  }

  if (key === "arrowright") {
    moveTo(player.x + 1, player.y);
  }

  if (key === "s") {
    stayTurn();
  }

  if (key === "r") {
    resetPressCount++;

    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      resetPressCount = 0;
    }, 1500);

    if (resetPressCount >= 5) {
      resetGame();
      resetPressCount = 0;
    }
  }
});
  </script>
</body>
</html>
