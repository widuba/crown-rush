<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crown Rush: Riftlands</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 215, 120, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(88, 101, 242, 0.2), transparent 35%),
        #10131f;
      color: #f7f1dd;
      min-height: 100vh;
    }

    .app {
      max-width: 1300px;
      margin: 0 auto;
      padding: 18px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: -1px;
    }

    .subtitle {
      color: #c9c0a7;
      margin-top: 4px;
      font-size: 15px;
    }

    button, select, input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: linear-gradient(135deg, #ffd56a, #ff9f43);
      color: #1a1207;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .danger {
      background: linear-gradient(135deg, #ff6b6b, #c92a2a);
      color: white;
    }

    .secondary {
      background: #252b3d;
      color: #f7f1dd;
      border: 1px solid #3a425c;
    }

    .setup {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 18px;
      display: grid;
      gap: 14px;
    }

    .setup-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    select, input {
      border-radius: 14px;
      border: 1px solid #3a425c;
      background: #171b2a;
      color: #fff;
      padding: 10px 12px;
    }

    .game {
      display: none;
      grid-template-columns: 280px 1fr 310px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .player-card {
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
      background: #171b2a;
      border: 2px solid transparent;
    }

    .player-card.active {
      border-color: #ffd56a;
      box-shadow: 0 0 18px rgba(255,213,106,0.25);
    }

    .player-name {
      font-weight: 900;
      font-size: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 8px;
      font-size: 14px;
    }

    .stat {
      background: rgba(255,255,255,0.07);
      padding: 7px;
      border-radius: 12px;
    }

    .board-wrap {
      display: grid;
      place-items: center;
    }

    .board {
      width: min(92vw, 640px);
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(7, 1fr);
      gap: 6px;
      background: rgba(255,255,255,0.05);
      padding: 8px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .tile {
      border-radius: 15px;
      border: 2px solid rgba(255,255,255,0.12);
      background: #23283a;
      color: white;
      position: relative;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      transition: transform 0.12s, border-color 0.12s;
    }

    .tile:hover {
      transform: translateY(-2px);
      border-color: #ffd56a;
    }

    .tile.selected {
      outline: 3px solid #ffd56a;
    }

    .tile.village { background: linear-gradient(135deg, #305f46, #173827); }
    .tile.mine { background: linear-gradient(135deg, #76613d, #3a2c18); }
    .tile.tower { background: linear-gradient(135deg, #3c5477, #202d44); }
    .tile.rift { background: linear-gradient(135deg, #6f42c1, #28124d); }
    .tile.forest { background: linear-gradient(135deg, #244d3b, #13271e); }
    .tile.vault { background: linear-gradient(135deg, #ffd56a, #9b5c00); color: #1a1207; }

    .tile-type {
      position: absolute;
      top: 5px;
      left: 6px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .tile-level {
      position: absolute;
      bottom: 5px;
      left: 6px;
      font-size: 12px;
      font-weight: 900;
    }

    .owner-dot {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid white;
    }

    .pieces {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-wrap: wrap;
      padding-top: 16px;
    }

    .piece {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid white;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      color: white;
      text-shadow: 0 1px 2px black;
    }

    .actions {
      display: grid;
      gap: 9px;
    }

    .actions button {
      width: 100%;
    }

    .log {
      max-height: 260px;
      overflow: auto;
      display: grid;
      gap: 8px;
      font-size: 14px;
      color: #d8d0bc;
    }

    .log-entry {
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 8px;
    }

    .card-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .game-card {
      background: #171b2a;
      border: 1px solid #3a425c;
      border-radius: 14px;
      padding: 10px;
    }

    .game-card strong {
      display: block;
      color: #ffd56a;
      margin-bottom: 3px;
    }

    .help {
      font-size: 14px;
      color: #c9c0a7;
      line-height: 1.45;
    }

    .winner {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 10;
      place-items: center;
      padding: 20px;
    }

    .winner-box {
      background: #171b2a;
      border: 2px solid #ffd56a;
      border-radius: 28px;
      max-width: 520px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 80px rgba(0,0,0,0.5);
    }

    .winner-box h2 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    @media (max-width: 1050px) {
      .game {
        grid-template-columns: 1fr;
      }

      .board {
        width: min(96vw, 640px);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>Crown Rush: Riftlands</h1>
        <div class="subtitle">A local pass-and-play strategy board game</div>
      </div>
      <button class="danger" onclick="resetGame()">Reset</button>
    </header>

    <section class="setup" id="setup">
      <h2>Start Game</h2>
      <div class="setup-row">
        <label>Players:</label>
        <select id="playerCount">
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4">4 Players</option>
        </select>

        <label>Win Crowns:</label>
        <select id="winCrowns">
          <option value="15">15</option>
          <option value="20" selected>20</option>
          <option value="25">25</option>
        </select>

        <button onclick="startGame()">Start</button>
      </div>

      <p class="help">
        Each player gets 5 energy per turn. Move, claim tiles, upgrade territory, attack rivals, draw cards, and survive random Riftland events.
      </p>
    </section>

    <main class="game" id="game">
      <aside class="panel">
        <h2>Players</h2>
        <div id="players"></div>

        <h2>Current Turn</h2>
        <div class="help" id="turnInfo"></div>
      </aside>

      <section class="board-wrap">
        <div class="board" id="board"></div>
      </section>

      <aside class="panel">
        <h2>Actions</h2>
        <div class="actions">
          <button onclick="setMode('move')">Move</button>
          <button onclick="setMode('claim')">Claim Tile</button>
          <button onclick="setMode('upgrade')">Upgrade Tile</button>
          <button onclick="setMode('attack')">Attack</button>
          <button onclick="drawCard()">Draw Card</button>
          <button onclick="useHeroPower()">Use Hero Power</button>
          <button class="secondary" onclick="endTurn()">End Turn</button>
        </div>

        <h2 style="margin-top:18px;">Your Cards</h2>
        <div id="cards" class="card-list"></div>

        <h2 style="margin-top:18px;">Event Log</h2>
        <div id="log" class="log"></div>
      </aside>
    </main>
  </div>

  <div class="winner" id="winner">
    <div class="winner-box">
      <h2 id="winnerTitle"></h2>
      <p id="winnerText"></p>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 7;

    const HEROES = [
      { name: "Knight", power: "Wins tied battles", bonus: "tie" },
      { name: "Rogue", power: "Steals 2 crowns after winning attacks", bonus: "steal" },
      { name: "Mage", power: "Teleport to any tile for 2 energy", bonus: "teleport" },
      { name: "Builder", power: "Upgrades cost 1 less gold", bonus: "build" }
    ];

    const COLORS = ["#ff4d4d", "#4dabf7", "#51cf66", "#cc5de8"];

    const TILE_TYPES = [
      "village", "village", "village",
      "mine", "mine",
      "tower", "tower",
      "forest", "forest",
      "rift"
    ];

    const CARD_DECK = [
      { name: "Ambush", text: "+3 in your next battle", type: "battle", value: 3 },
      { name: "Royal Tax", text: "Gain 3 gold", type: "gold", value: 3 },
      { name: "Shortcut", text: "Move to any adjacent tile for free", type: "freeMove", value: 1 },
      { name: "Sabotage", text: "Remove one enemy claim from a selected tile", type: "sabotage", value: 1 },
      { name: "Fortify", text: "Add +1 level to one owned tile for free", type: "fortify", value: 1 },
      { name: "Crown Spark", text: "Gain 2 crowns", type: "crowns", value: 2 }
    ];

    let state = null;
    let mode = "move";

    function startGame() {
      const count = Number(document.getElementById("playerCount").value);
      const winCrowns = Number(document.getElementById("winCrowns").value);

      const players = [];

      for (let i = 0; i < count; i++) {
        players.push({
          id: i,
          name: `Player ${i + 1}`,
          hero: HEROES[i],
          color: COLORS[i],
          crowns: 5,
          gold: 5,
          energy: 5,
          position: getStartPosition(i),
          cards: [],
          battleBonus: 0
        });
      }

      state = {
        players,
        current: 0,
        round: 1,
        winCrowns,
        board: createBoard(),
        log: ["Game started. Claim territory and race for crowns."]
      };

      document.getElementById("setup").style.display = "none";
      document.getElementById("game").style.display = "grid";
      render();
    }

    function createBoard() {
      const board = [];

      for (let y = 0; y < BOARD_SIZE; y++) {
        for (let x = 0; x < BOARD_SIZE; x++) {
          let type = TILE_TYPES[Math.floor(Math.random() * TILE_TYPES.length)];

          if (x === 3 && y === 3) type = "vault";

          board.push({
            x,
            y,
            type,
            owner: null,
            level: 1
          });
        }
      }

      return board;
    }

    function getStartPosition(i) {
      const spots = [
        { x: 0, y: 0 },
        { x: 6, y: 6 },
        { x: 6, y: 0 },
        { x: 0, y: 6 }
      ];
      return spots[i];
    }

    function currentPlayer() {
      return state.players[state.current];
    }

    function getTile(x, y) {
      return state.board.find(t => t.x === x && t.y === y);
    }

    function getTileIndex(x, y) {
      return state.board.findIndex(t => t.x === x && t.y === y);
    }

    function render() {
      renderPlayers();
      renderBoard();
      renderTurnInfo();
      renderCards();
      renderLog();
      checkWinner();
    }

    function renderPlayers() {
      const box = document.getElementById("players");
      box.innerHTML = "";

      state.players.forEach((p, index) => {
        box.innerHTML += `
          <div class="player-card ${index === state.current ? "active" : ""}">
            <div class="player-name" style="color:${p.color};">${p.name}</div>
            <div class="help">${p.hero.name}: ${p.hero.power}</div>
            <div class="stats">
              <div class="stat">Crowns: <b>${p.crowns}</b></div>
              <div class="stat">Gold: <b>${p.gold}</b></div>
              <div class="stat">Energy: <b>${p.energy}</b></div>
              <div class="stat">Cards: <b>${p.cards.length}</b></div>
            </div>
          </div>
        `;
      });
    }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      state.board.forEach(tile => {
        const pieces = state.players.filter(p => p.position.x === tile.x && p.position.y === tile.y);
        const owner = tile.owner !== null ? state.players[tile.owner] : null;

        const pieceHTML = pieces.map(p => `
          <div class="piece" style="background:${p.color};">${p.id + 1}</div>
        `).join("");

        board.innerHTML += `
          <button class="tile ${tile.type}" onclick="tileClick(${tile.x}, ${tile.y})">
            <div class="tile-type">${tile.type}</div>
            ${owner ? `<div class="owner-dot" style="background:${owner.color};"></div>` : ""}
            <div class="pieces">${pieceHTML}</div>
            <div class="tile-level">L${tile.level}</div>
          </button>
        `;
      });
    }

    function renderTurnInfo() {
      const p = currentPlayer();
      document.getElementById("turnInfo").innerHTML = `
        <b style="color:${p.color};">${p.name}</b><br>
        Hero: ${p.hero.name}<br>
        Round: ${state.round}<br>
        Mode: <b>${mode}</b>
      `;
    }

    function renderCards() {
      const box = document.getElementById("cards");
      const p = currentPlayer();

      if (p.cards.length === 0) {
        box.innerHTML = `<div class="help">No cards yet.</div>`;
        return;
      }

      box.innerHTML = p.cards.map((card, i) => `
        <div class="game-card">
          <strong>${card.name}</strong>
          <div class="help">${card.text}</div>
          <button style="margin-top:8px;" onclick="useCard(${i})">Use</button>
        </div>
      `).join("");
    }

    function renderLog() {
      document.getElementById("log").innerHTML = state.log.slice(-14).reverse().map(entry => `
        <div class="log-entry">${entry}</div>
      `).join("");
    }

    function setMode(newMode) {
      mode = newMode;
      render();
    }

    function tileClick(x, y) {
      const p = currentPlayer();
      const tile = getTile(x, y);

      if (mode === "move") movePlayer(p, x, y);
      if (mode === "claim") claimTile(p, tile);
      if (mode === "upgrade") upgradeTile(p, tile);
      if (mode === "attack") attackTile(p, tile);

      render();
    }

    function isAdjacent(a, b) {
      const dx = Math.abs(a.x - b.x);
      const dy = Math.abs(a.y - b.y);
      return dx + dy === 1;
    }

    function movePlayer(p, x, y) {
      if (p.energy < 1) return log("Not enough energy.");

      if (!isAdjacent(p.position, { x, y })) {
        return log("You can only move one tile.");
      }

      p.position = { x, y };
      p.energy -= 1;

      const tile = getTile(x, y);
      log(`${p.name} moved to ${tile.type}.`);

      if (tile.type === "rift") triggerRift(p);
    }

    function claimTile(p, tile) {
      if (p.energy < 2) return log("Claiming costs 2 energy.");
      if (tile.owner === p.id) return log("You already own this tile.");
      if (tile.owner !== null) return log("Enemy tile. Attack or sabotage it first.");
      if (p.position.x !== tile.x || p.position.y !== tile.y) return log("You must stand on a tile to claim it.");

      tile.owner = p.id;
      p.energy -= 2;
      log(`${p.name} claimed a ${tile.type}.`);
    }

    function upgradeTile(p, tile) {
      if (tile.owner !== p.id) return log("You can only upgrade your own tile.");
      if (tile.level >= 3) return log("Tile is already max level.");

      const cost = p.hero.bonus === "build" ? 2 : 3;

      if (p.gold < cost) return log(`Upgrade costs ${cost} gold.`);

      p.gold -= cost;
      tile.level += 1;
      log(`${p.name} upgraded ${tile.type} to level ${tile.level}.`);
    }

    function attackTile(p, tile) {
      if (p.energy < 2) return log("Attack costs 2 energy.");

      const defender = state.players.find(other =>
        other.id !== p.id &&
        other.position.x === tile.x &&
        other.position.y === tile.y
      );

      if (!defender) return log("No enemy on that tile.");
      if (!isAdjacent(p.position, defender.position)) return log("Enemy must be adjacent.");

      p.energy -= 2;

      const attackRoll = rollDie();
      const defenseRoll = rollDie();

      const attackPower = attackRoll + p.battleBonus + getOwnedBonus(p);
      const defensePower = defenseRoll + getTileDefense(defender, tile);

      p.battleBonus = 0;

      if (attackPower > defensePower || (attackPower === defensePower && p.hero.bonus === "tie")) {
        const stolen = p.hero.bonus === "steal" ? 2 : 1;
        const amount = Math.min(stolen, defender.crowns);

        defender.crowns -= amount;
        p.crowns += amount;
        defender.position = getStartPosition(defender.id);

        log(`${p.name} won battle ${attackPower}-${defensePower} and stole ${amount} crown(s).`);
      } else {
        log(`${p.name} lost battle ${attackPower}-${defensePower}.`);
      }
    }

    function getTileDefense(player, tile) {
      let bonus = 0;
      if (tile.owner === player.id) bonus += tile.level;
      if (tile.type === "tower" && tile.owner === player.id) bonus += 2;
      return bonus;
    }

    function getOwnedBonus(player) {
      const owned = state.board.filter(t => t.owner === player.id).length;
      if (owned >= 5) return 2;
      if (owned >= 3) return 1;
      return 0;
    }

    function drawCard() {
      const p = currentPlayer();
      if (p.energy < 1) return log("Drawing costs 1 energy.");

      const card = CARD_DECK[Math.floor(Math.random() * CARD_DECK.length)];
      p.cards.push({ ...card });
      p.energy -= 1;

      log(`${p.name} drew a card.`);
      render();
    }

    function useCard(index) {
      const p = currentPlayer();
      const card = p.cards[index];

      if (!card) return;

      if (card.type === "battle") {
        p.battleBonus += card.value;
        log(`${p.name} prepared Ambush: +${card.value} battle power.`);
      }

      if (card.type === "gold") {
        p.gold += card.value;
        log(`${p.name} gained ${card.value} gold.`);
      }

      if (card.type === "crowns") {
        p.crowns += card.value;
        log(`${p.name} gained ${card.value} crowns.`);
      }

      if (card.type === "fortify") {
        const owned = state.board.find(t => t.owner === p.id && t.level < 3);
        if (owned) {
          owned.level += 1;
          log(`${p.name} fortified a ${owned.type}.`);
        } else {
          log("No owned tile can be fortified.");
        }
      }

      if (card.type === "sabotage") {
        const enemyTile = state.board.find(t => t.owner !== null && t.owner !== p.id);
        if (enemyTile) {
          enemyTile.owner = null;
          enemyTile.level = 1;
          log(`${p.name} sabotaged an enemy tile.`);
        } else {
          log("No enemy tile to sabotage.");
        }
      }

      if (card.type === "freeMove") {
        log(`${p.name} may use Move mode without losing energy next time. For now, gain 1 energy back.`);
        p.energy += 1;
      }

      p.cards.splice(index, 1);
      render();
    }

    function useHeroPower() {
      const p = currentPlayer();

      if (p.hero.bonus === "teleport") {
        if (p.energy < 2) return log("Teleport costs 2 energy.");

        const tile = state.board[Math.floor(Math.random() * state.board.length)];
        p.position = { x: tile.x, y: tile.y };
        p.energy -= 2;
        log(`${p.name} teleported through the Rift.`);
      } else {
        log(`${p.hero.name} has a passive power.`);
      }

      render();
    }

    function endTurn() {
      collectIncome(currentPlayer());

      state.current++;

      if (state.current >= state.players.length) {
        state.current = 0;
        state.round++;
        triggerRoundEvent();
      }

      currentPlayer().energy = 5;
      mode = "move";

      render();
    }

    function collectIncome(p) {
      let crowns = 0;
      let gold = 0;

      state.board.forEach(tile => {
        if (tile.owner !== p.id) return;

        if (tile.type === "village") crowns += tile.level;
        if (tile.type === "mine") gold += tile.level + 1;
        if (tile.type === "vault") crowns += 2 + tile.level;
        if (tile.type === "forest") gold += 1;
      });

      const connected = state.board.filter(t => t.owner === p.id).length;
      if (connected >= 5) crowns += 2;
      else if (connected >= 3) crowns += 1;

      p.crowns += crowns;
      p.gold += gold;

      if (crowns || gold) {
        log(`${p.name} income: +${crowns} crowns, +${gold} gold.`);
      }
    }

    function triggerRoundEvent() {
      const events = [
        "meteor",
        "tax",
        "festival",
        "storm",
        "growth"
      ];

      const event = events[Math.floor(Math.random() * events.length)];

      if (event === "meteor") {
        const owned = state.board.filter(t => t.owner !== null);
        if (owned.length) {
          const tile = owned[Math.floor(Math.random() * owned.length)];
          tile.owner = null;
          tile.level = 1;
          log("Round Event: Meteor destroyed a claimed tile.");
        }
      }

      if (event === "tax") {
        const richest = [...state.players].sort((a, b) => b.crowns - a.crowns)[0];
        const loss = Math.min(2, richest.crowns);
        richest.crowns -= loss;
        log(`Round Event: Crown Tax. ${richest.name} lost ${loss} crowns.`);
      }

      if (event === "festival") {
        const poorest = [...state.players].sort((a, b) => a.crowns - b.crowns)[0];
        poorest.crowns += 3;
        log(`Round Event: Festival. ${poorest.name} gained 3 crowns.`);
      }

      if (event === "storm") {
        state.players.forEach(p => {
          const tile = state.board[Math.floor(Math.random() * state.board.length)];
          p.position = { x: tile.x, y: tile.y };
        });
        log("Round Event: Portal Storm moved every player.");
      }

      if (event === "growth") {
        const tile = state.board.find(t => t.owner !== null && t.level < 3);
        if (tile) {
          tile.level++;
          log("Round Event: Wild Growth upgraded a random claimed tile.");
        }
      }
    }

    function triggerRift(p) {
      const effects = [
        () => {
          p.gold += 2;
          log(`${p.name} found 2 gold in the Rift.`);
        },
        () => {
          p.crowns += 1;
          log(`${p.name} gained 1 crown from the Rift.`);
        },
        () => {
          p.energy = Math.max(0, p.energy - 1);
          log(`${p.name} lost 1 energy to the Rift.`);
        },
        () => {
          const tile = state.board[Math.floor(Math.random() * state.board.length)];
          p.position = { x: tile.x, y: tile.y };
          log(`${p.name} was warped by the Rift.`);
        }
      ];

      effects[Math.floor(Math.random() * effects.length)]();
    }

    function checkWinner() {
      const winner = state.players.find(p => p.crowns >= state.winCrowns);

      if (!winner) return;

      document.getElementById("winner").style.display = "grid";
      document.getElementById("winnerTitle").textContent = `${winner.name} Wins!`;
      document.getElementById("winnerText").textContent = `${winner.name} reached ${winner.crowns} crowns as the ${winner.hero.name}.`;
    }

    function rollDie() {
      return Math.floor(Math.random() * 6) + 1;
    }

    function log(text) {
      state.log.push(text);
    }

    function resetGame() {
      location.reload();
    }
  </script>
</body>
</html>
