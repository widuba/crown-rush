<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Towers</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #151820;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(95vw, 850px);
      text-align: center;
    }

    .top {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    select, button {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
    }

    button {
      cursor: pointer;
      background: #ffd166;
      color: #1b1b1b;
    }

    .info {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .scores {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .score {
      padding: 8px 12px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      border: 2px solid white;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      background: #0b0d12;
      padding: 8px;
      border-radius: 16px;
      margin: 0 auto;
      width: min(92vw, 640px);
      aspect-ratio: 1 / 1;
    }

    .tile {
      position: relative;
      border-radius: 10px;
      border: 2px solid #2c3345;
      cursor: pointer;
      font-weight: bold;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .hidden {
      background: #ffffff;
      color: transparent;
      border-color: #e5e5e5;
    }

    .revealed {
      background: #2d3748;
      color: white;
    }

    .tower {
      color: white;
    }

    .tower-number {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      z-index: 1;
    }

    .progress-wrap {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 6px;
      height: 7px;
      background: rgba(255,255,255,0.35);
      border-radius: 999px;
      overflow: hidden;
      z-index: 3;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 999px;
    }

    .players {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
      flex-wrap: wrap;
      padding: 5px;
      z-index: 4;
    }

    .piece {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: white;
      text-shadow: 0 1px 2px black;
    }

    .note {
      color: #cbd5e1;
      margin-top: 14px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Hidden Towers</h1>

    <div class="top">
      <select id="playerCount">
        <option value="2">2 Players</option>
        <option value="3">3 Players</option>
        <option value="4">4 Players</option>
      </select>
      <button onclick="startGame()">Start Game</button>
      <button onclick="stayTurn()">Stay</button>
      <button onclick="resetGame()">Reset</button>
    </div>

    <div class="info" id="info">Choose players and start.</div>
    <div class="scores" id="scores"></div>
    <div class="board" id="board"></div>

    <div class="note">
      Click an adjacent square to move. Use Stay when standing on a tower to level it up or capture it.
    </div>
  </div>

  <script>
    const SIZE = 8;
    const TOWER_COUNT = 7;
    const MIN_DISTANCE = 5;
    const MAX_TOWER_LEVEL = 8;

    const PLAYER_COLORS = ["#e03131", "#1971c2", "#2f9e44", "#9c36b5"];

    let tiles = [];
    let players = [];
    let currentPlayer = 0;

    function startGame() {
      const count = Number(document.getElementById("playerCount").value);

      tiles = [];
      players = [];
      currentPlayer = 0;

      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          tiles.push({
            x,
            y,
            revealed: false,
            type: "empty",
            owner: null,
            level: 1,
            ownerProgress: 0,
            invaderId: null,
            invaderProgress: 0
          });
        }
      }

      const starts = generateStartPositions(count);

      for (let i = 0; i < count; i++) {
        players.push({
          id: i,
          x: starts[i].x,
          y: starts[i].y,
          color: PLAYER_COLORS[i],
          points: 0
        });

        getTile(starts[i].x, starts[i].y).revealed = true;
      }

      placeTowers(starts);
      render();
    }

    function generateStartPositions(count) {
      const positions = [];
      let attempts = 0;

      while (positions.length < count && attempts < 5000) {
        attempts++;

        const pos = {
          x: Math.floor(Math.random() * SIZE),
          y: Math.floor(Math.random() * SIZE)
        };

        const farEnough = positions.every(other => {
          return manhattan(pos, other) >= MIN_DISTANCE;
        });

        if (farEnough) positions.push(pos);
      }

      if (positions.length < count) {
        return [
          { x: 0, y: 0 },
          { x: 7, y: 7 },
          { x: 7, y: 0 },
          { x: 0, y: 7 }
        ].slice(0, count);
      }

      return positions;
    }

    function placeTowers(startPositions) {
      let placed = 0;

      while (placed < TOWER_COUNT) {
        const x = Math.floor(Math.random() * SIZE);
        const y = Math.floor(Math.random() * SIZE);

        const isStart = startPositions.some(pos => pos.x === x && pos.y === y);
        const tile = getTile(x, y);

        if (!isStart && tile.type !== "tower") {
          tile.type = "tower";
          placed++;
        }
      }
    }

    function render() {
      renderScores();
      renderBoard();

      if (players.length) {
        document.getElementById("info").textContent = `Player ${currentPlayer + 1}'s turn`;
      } else {
        document.getElementById("info").textContent = "Choose players and start.";
      }
    }

    function renderScores() {
      const scores = document.getElementById("scores");
      scores.innerHTML = "";

      players.forEach(player => {
        const div = document.createElement("div");
        div.className = "score";
        div.style.background = player.color;
        div.textContent = `P${player.id + 1}: ${player.points} pts`;
        scores.appendChild(div);
      });
    }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      for (const tile of tiles) {
        const tilePlayers = players.filter(p => p.x === tile.x && p.y === tile.y);

        const div = document.createElement("div");
        div.className = "tile ";

        if (!tile.revealed) {
          div.className += "hidden";
        } else if (tile.type === "tower") {
          div.className += "tower";
          div.style.background = tile.owner !== null ? players[tile.owner].color : "#7048e8";

          const towerNumber = document.createElement("div");
          towerNumber.className = "tower-number";
          towerNumber.textContent = tile.level;
          div.appendChild(towerNumber);

          const progressWrap = document.createElement("div");
          progressWrap.className = "progress-wrap";

          const progressBar = document.createElement("div");
          progressBar.className = "progress-bar";
          progressBar.style.width = getTowerProgressPercent(tile) + "%";

          progressWrap.appendChild(progressBar);
          div.appendChild(progressWrap);
        } else {
          div.className += "revealed";
        }

        div.onclick = () => moveTo(tile.x, tile.y);

        const playerLayer = document.createElement("div");
        playerLayer.className = "players";

        tilePlayers.forEach(p => {
          const piece = document.createElement("div");
          piece.className = "piece";
          piece.style.background = p.color;
          piece.textContent = p.id + 1;
          playerLayer.appendChild(piece);
        });

        div.appendChild(playerLayer);
        board.appendChild(div);
      }
    }

    function moveTo(x, y) {
      if (!players.length) return;

      const player = players[currentPlayer];

      if (!isAdjacent(player.x, player.y, x, y)) return;

      player.x = x;
      player.y = y;

      const tile = getTile(x, y);
      tile.revealed = true;

      handleTowerStep(player, tile, true);
      nextTurn();
    }

    function stayTurn() {
      if (!players.length) return;

      const player = players[currentPlayer];
      const tile = getTile(player.x, player.y);

      tile.revealed = true;

      handleTowerStep(player, tile, false);
      nextTurn();
    }

    function handleTowerStep(player, tile, justMovedOntoTile) {
      if (tile.type !== "tower") return;

      if (tile.owner === null) {
        tile.owner = player.id;
        tile.level = 1;
        tile.ownerProgress = 0;
        tile.invaderId = null;
        tile.invaderProgress = 0;
        player.points += pointsForTowerLevel(tile.level);
        return;
      }

      if (tile.owner === player.id) {
        tile.invaderId = null;
        tile.invaderProgress = 0;

        if (justMovedOntoTile) return;
        if (tile.level >= MAX_TOWER_LEVEL) return;

        tile.ownerProgress++;

        const needed = tile.level;

        if (tile.ownerProgress >= needed) {
          tile.level++;
          tile.ownerProgress = 0;
          player.points += pointsForTowerLevel(tile.level);
        }

        return;
      }

      tile.ownerProgress = 0;

      if (tile.invaderId !== player.id) {
        tile.invaderId = player.id;
        tile.invaderProgress = 0;
      }

      tile.invaderProgress++;

      if (tile.invaderProgress >= 5) {
        tile.owner = player.id;
        tile.invaderId = null;
        tile.invaderProgress = 0;
        tile.ownerProgress = 0;
        player.points += pointsForTowerLevel(tile.level);
      }
    }

    function pointsForTowerLevel(level) {
      return 50 + (level - 1) * 107;
    }

    function getTowerProgressPercent(tile) {
      if (tile.owner === null) return 0;

      if (tile.invaderId !== null) {
        return Math.min(100, (tile.invaderProgress / 5) * 100);
      }

      if (tile.level >= MAX_TOWER_LEVEL) return 100;

      return Math.min(100, (tile.ownerProgress / tile.level) * 100);
    }

    function nextTurn() {
      currentPlayer++;
      if (currentPlayer >= players.length) currentPlayer = 0;
      render();
    }

    function isAdjacent(x1, y1, x2, y2) {
      const dx = Math.abs(x1 - x2);
      const dy = Math.abs(y1 - y2);
      return dx + dy === 1;
    }

    function getTile(x, y) {
      return tiles.find(tile => tile.x === x && tile.y === y);
    }

    function manhattan(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    function resetGame() {
      tiles = [];
      players = [];
      currentPlayer = 0;
      document.getElementById("board").innerHTML = "";
      document.getElementById("scores").innerHTML = "";
      document.getElementById("info").textContent = "Choose players and start.";
    }
  </script>
</body>
</html>
