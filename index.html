<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Towers</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #151820;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(95vw, 900px);
      text-align: center;
    }

    .setup-card {
      background: #202636;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .top, .setup-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
    }

    input[type="color"] {
      padding: 3px;
      width: 52px;
      height: 42px;
    }

    button {
      cursor: pointer;
      background: #ffd166;
      color: #1b1b1b;
    }

    .info {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .scores {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .score {
      padding: 8px 12px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      border: 2px solid white;
    }

    .board {
      display: grid;
      gap: 6px;
      background: #0b0d12;
      padding: 8px;
      border-radius: 16px;
      margin: 0 auto;
      width: min(92vw, 640px);
      aspect-ratio: 1 / 1;
    }

    .tile {
      position: relative;
      border-radius: 10px;
      border: 2px solid #2c3345;
      cursor: pointer;
      font-weight: bold;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .hidden {
      background: #fff;
      color: transparent;
      border-color: #e5e5e5;
    }

    .revealed {
      background: #2d3748;
      color: white;
    }

    .tower {
      color: white;
    }

    .gas-origin {
      background: #0b7a34 !important;
      color: white;
    }

    .infected {
      background: #2ecc71 !important;
      color: white;
    }

    .gas-mark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(22px, 4vw, 38px);
      font-weight: 900;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 2px 4px black;
    }

    .tower-number {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 900;
      pointer-events: none;
      z-index: 1;
    }

    .progress-wrap {
      position: absolute;
      left: 7px;
      right: 7px;
      bottom: 6px;
      height: 7px;
      background: rgba(255,255,255,0.35);
      border-radius: 999px;
      overflow: hidden;
      z-index: 3;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 999px;
    }

    .players {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 3px;
      flex-wrap: wrap;
      padding: 5px;
      z-index: 4;
    }

    .piece {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: white;
      text-shadow: 0 1px 2px black;
    }

    .note {
      color: #cbd5e1;
      margin-top: 14px;
      font-size: 14px;
    }

    .game-over {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      z-index: 20;
      place-items: center;
      padding: 20px;
    }

    .game-over-box {
      background: #202636;
      border-radius: 22px;
      padding: 24px;
      width: min(95vw, 650px);
      border: 3px solid #ffd166;
    }

    .ranking {
      display: grid;
      gap: 10px;
      margin: 18px 0;
      text-align: left;
    }

    .rank-row {
      padding: 12px;
      border-radius: 14px;
      background: #151820;
      border: 2px solid #374151;
    }

    .secret-button {
      position: fixed;
      left: 8px;
      bottom: 8px;
      width: 36px;
      height: 36px;
      opacity: 0.08;
      background: white;
      border-radius: 50%;
      z-index: 30;
      padding: 0;
    }

    .secret-button:hover {
      opacity: 0.18;
    }

    .secret-panel {
      display: none;
      position: fixed;
      left: 12px;
      bottom: 56px;
      width: min(92vw, 360px);
      background: #202636;
      border: 2px solid #ffd166;
      border-radius: 16px;
      padding: 14px;
      z-index: 31;
      text-align: left;
      box-shadow: 0 15px 45px rgba(0,0,0,0.45);
    }

    .secret-panel h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .secret-panel input {
      width: 100%;
      margin-bottom: 8px;
    }

    .secret-list {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 8px;
      line-height: 1.4;
    }

    .stay-btn {
      font-size: 18px;
      padding: 16px 28px;
    }

    .reset-bottom {
      position: fixed;
      bottom: 12px;
      right: 12px;
      padding: 12px 18px;
      background: #ff6b6b;
      color: white;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      z-index: 40;
    }
  </style>
</head>

<body>
  <div class="app">
    <a href="https://hiddentowers.onrender.com" target="_blank">
  <button style="margin-bottom: 10px;">
    Switch to Cross-Device Play
  </button>
</a>
      
    <h1>Hidden Towers</h1>

    <div class="setup-card" id="setupCard">
      <div class="setup-row">
        <select id="playerCount" onchange="buildPlayerInputs()">
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4">4 Players</option>
        </select>
        <button onclick="startGame()">Start Game</button>
      </div>

      <div id="playerInputs"></div>
    </div>

    <div class="top">
      <button class="stay-btn" onclick="stayTurn()">Stay</button>
    </div>

    <button class="reset-bottom" onclick="confirmReset()">Reset</button>

    <div class="info" id="info">Name players, pick colors, and start.</div>
    <div class="scores" id="scores"></div>
    <div class="board" id="board"></div>

    <div class="note" id="gameNote">
      Reveal hidden tiles for 10 points. First to 5000 points or 4 towers wins. Arrow keys move. S stays. Press R 5 times to reset.
    </div>
  </div>

  <button class="secret-button" onclick="toggleSecretPanel()" title=""></button>

  <div class="secret-panel" id="secretPanel">
    <h3>Session Boost</h3>
    <input id="secretNameInput" placeholder="Type player name exactly">
    <button onclick="addSecretPlayer()">Add Player</button>
    <button onclick="clearSecretPlayers()">Clear</button>
    <div class="secret-list" id="secretList">No boosted players yet.</div>
  </div>

  <div class="game-over" id="gameOver">
    <div class="game-over-box">
      <h2 id="winnerTitle"></h2>
      <p id="winnerReason"></p>
      <div class="ranking" id="finalRanking"></div>
      <button onclick="hideGameOver()">Hide Final Screen</button>
      <button onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    let SIZE = 8;
    let TOWER_COUNT = 7;
    let POINTS_TO_WIN = 5000;
    let USE_TOWER_WIN = true;
    let TWO_PLAYER_MODE = false;

    const MIN_DISTANCE = 5;
    const MAX_TOWER_LEVEL = 8;
    const TOWERS_TO_WIN = 4;
    const REVEAL_POINTS = 10;
    const MAX_SECRET_PLAYERS = 5;

    const DEFAULT_COLORS = ["#e03131", "#1971c2", "#2f9e44", "#9c36b5"];

    let tiles = [];
    let players = [];
    let currentPlayer = 0;
    let gameEnded = false;
    let finalWinnerId = null;
    let consecutiveStayTurns = 0;
    let resetPressCount = 0;
    let resetTimer = null;
    let secretPlayerNames = [];

    let gasOrigin = null;
    let gasActive = false;
    let infectedTiles = new Set();
    let gasRound = 0;
    let fullRoundNumber = 1;

    buildPlayerInputs();

    function buildPlayerInputs() {
      const count = parseInt(document.getElementById("playerCount").value, 10);
      const box = document.getElementById("playerInputs");
      box.innerHTML = "";

      for (let i = 0; i < count; i++) {
        box.innerHTML += `
          <div class="setup-row">
            <input id="name${i}" value="Player ${i + 1}" maxlength="16">
            <input id="color${i}" type="color" value="${DEFAULT_COLORS[i]}">
          </div>
        `;
      }
    }

    function applyModeSettings() {
      const selectedPlayerCount = parseInt(document.getElementById("playerCount").value, 10);
      TWO_PLAYER_MODE = selectedPlayerCount === 2;

      if (TWO_PLAYER_MODE) {
        SIZE = 6;
        TOWER_COUNT = 4;
        POINTS_TO_WIN = 2000;
        USE_TOWER_WIN = false;

        document.getElementById("gameNote").textContent =
          "2-player mode: 6x6 board, 4 towers, first to 2000 points wins. One hidden poison gas tile spreads after it is revealed.";
      } else {
        SIZE = 8;
        TOWER_COUNT = 7;
        POINTS_TO_WIN = 5000;
        USE_TOWER_WIN = true;

        document.getElementById("gameNote").textContent =
          "Reveal hidden tiles for 10 points. First to 5000 points or 4 towers wins. Arrow keys move. S stays. Press R 5 times to reset.";
      }

      const board = document.getElementById("board");
      board.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
      board.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;
    }

    function startGame() {
      applyModeSettings();

      const count = parseInt(document.getElementById("playerCount").value, 10);

      tiles = [];
      players = [];
      currentPlayer = 0;
      gameEnded = false;
      finalWinnerId = null;
      consecutiveStayTurns = 0;
      resetPressCount = 0;

      gasOrigin = null;
      gasActive = false;
      infectedTiles = new Set();
      gasRound = 0;
      fullRoundNumber = 1;

      document.getElementById("gameOver").style.display = "none";
      document.getElementById("setupCard").style.display = "none";

      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          tiles.push({
            x,
            y,
            revealed: false,
            type: "empty",
            owner: null,
            level: 1,
            ownerProgress: 0,
            invaderId: null,
            invaderProgress: 0
          });
        }
      }

      const starts = generateStartPositions(count);

      for (let i = 0; i < count; i++) {
        const name = document.getElementById(`name${i}`).value.trim() || `Player ${i + 1}`;
        const color = document.getElementById(`color${i}`).value;

        players.push({
          id: i,
          name,
          x: starts[i].x,
          y: starts[i].y,
          color,
          points: 0,
          infected: false
        });

        getTile(starts[i].x, starts[i].y).revealed = true;
      }

      placeTowers(starts);

      if (TWO_PLAYER_MODE) {
        placeGas(starts);
      }

      render();
    }

    function generateStartPositions(count) {
      const positions = [];
      let attempts = 0;
      const minDistance = TWO_PLAYER_MODE ? 4 : MIN_DISTANCE;

      while (positions.length < count && attempts < 5000) {
        attempts++;

        const pos = {
          x: Math.floor(Math.random() * SIZE),
          y: Math.floor(Math.random() * SIZE)
        };

        const farEnough = positions.every(other => manhattan(pos, other) >= minDistance);

        if (farEnough) positions.push(pos);
      }

      if (positions.length < count) {
        if (TWO_PLAYER_MODE) {
          return [
            { x: 0, y: 0 },
            { x: 5, y: 5 }
          ].slice(0, count);
        }

        return [
          { x: 0, y: 0 },
          { x: 7, y: 7 },
          { x: 7, y: 0 },
          { x: 0, y: 7 }
        ].slice(0, count);
      }

      return positions;
    }

    function placeTowers(startPositions) {
      let placed = 0;

      while (placed < TOWER_COUNT) {
        const x = Math.floor(Math.random() * SIZE);
        const y = Math.floor(Math.random() * SIZE);

        const isStart = startPositions.some(pos => pos.x === x && pos.y === y);
        const tile = getTile(x, y);

        if (!isStart && tile.type !== "tower") {
          tile.type = "tower";
          placed++;
        }
      }
    }

    function placeGas(startPositions) {
      let attempts = 0;

      while (attempts < 5000) {
        attempts++;

        const x = Math.floor(Math.random() * SIZE);
        const y = Math.floor(Math.random() * SIZE);
        const tile = getTile(x, y);
        const isStart = startPositions.some(pos => pos.x === x && pos.y === y);

        if (!isStart && tile.type !== "tower") {
          tile.type = "gas";
          return;
        }
      }
    }

    function render() {
      renderScores();
      renderBoard();
      renderSecretList();

      if (players.length && !gameEnded) {
        const gasText = TWO_PLAYER_MODE && gasActive ? ` | Gas round ${gasRound}` : "";
        document.getElementById("info").textContent =
          `${players[currentPlayer].name}'s turn | Round ${fullRoundNumber}${gasText}`;
      } else if (players.length && gameEnded) {
        document.getElementById("info").textContent = "Game over. Hide the final screen to inspect the board.";
      } else {
        document.getElementById("info").textContent = "Name players, pick colors, and start.";
      }
    }

    function renderScores() {
      const scores = document.getElementById("scores");
      scores.innerHTML = "";

      players.forEach(player => {
        const div = document.createElement("div");
        div.className = "score";
        div.style.background = player.color;
        div.textContent =
          `${player.name}: ${player.points} pts | Towers: ${countOwnedTowers(player.id)}${player.infected ? " | Infected" : ""}`;
        scores.appendChild(div);
      });
    }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      board.style.gridTemplateColumns = `repeat(${SIZE}, 1fr)`;
      board.style.gridTemplateRows = `repeat(${SIZE}, 1fr)`;

      for (const tile of tiles) {
        const tilePlayers = players.filter(p => p.x === tile.x && p.y === tile.y);
        const key = tileKey(tile.x, tile.y);

        const div = document.createElement("div");
        div.className = "tile ";

        if (!tile.revealed) {
          div.className += "hidden";
        } else if (tile.type === "tower") {
          div.className += "tower";
          div.style.background = tile.owner !== null ? players[tile.owner].color : "#7048e8";

          const towerNumber = document.createElement("div");
          towerNumber.className = "tower-number";
          towerNumber.textContent = tile.level;
          div.appendChild(towerNumber);

          const progressWrap = document.createElement("div");
          progressWrap.className = "progress-wrap";

          const progressBar = document.createElement("div");
          progressBar.className = "progress-bar";
          progressBar.style.width = getTowerProgressPercent(tile) + "%";

          progressWrap.appendChild(progressBar);
          div.appendChild(progressWrap);
        } else {
          div.className += "revealed";
        }

        if (tile.revealed && tile.type === "gas") {
          div.className += " gas-origin";

          const gasMark = document.createElement("div");
          gasMark.className = "gas-mark";
          gasMark.textContent = "☣";
          div.appendChild(gasMark);
        }

        if (infectedTiles.has(key) && !(gasOrigin && gasOrigin.x === tile.x && gasOrigin.y === tile.y)) {
          div.className += " infected";
        }

        div.onclick = () => moveTo(tile.x, tile.y);

        const playerLayer = document.createElement("div");
        playerLayer.className = "players";

        tilePlayers.forEach(p => {
          const piece = document.createElement("div");
          piece.className = "piece";
          piece.style.background = p.color;
          piece.textContent = p.name.charAt(0).toUpperCase();
          playerLayer.appendChild(piece);
        });

        div.appendChild(playerLayer);
        board.appendChild(div);
      }
    }

    function moveTo(x, y) {
      if (!players.length || gameEnded) return;
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;

      const player = players[currentPlayer];

      if (player.infected) {
        teleportPlayer(player);
        player.infected = false;
        consecutiveStayTurns = 0;

        if (checkWinner(player)) return;

        nextTurn();
        return;
      }

      if (!isAdjacent(player.x, player.y, x, y)) return;

      player.x = x;
      player.y = y;

      const tile = getTile(x, y);
      const wasHidden = tile.revealed === false;

      if (wasHidden) {
        if (isSecretPlayer(player.name)) {
          tile.type = "tower";
          tile.owner = null;
          tile.level = 1;
          tile.ownerProgress = 0;
          tile.invaderId = null;
          tile.invaderProgress = 0;
        }

        tile.revealed = true;
        player.points += REVEAL_POINTS;

        if (TWO_PLAYER_MODE && tile.type === "gas" && !gasActive) {
          gasActive = true;
          gasOrigin = { x: tile.x, y: tile.y };
          infectedTiles.add(tileKey(tile.x, tile.y));
        }
      }

      handleTowerStep(player, tile, true);
      handleInfection(player);

      consecutiveStayTurns = 0;

      if (checkWinner(player)) return;

      nextTurn();
    }

    function stayTurn() {
      if (!players.length || gameEnded) return;

      const player = players[currentPlayer];

      if (player.infected) {
        teleportPlayer(player);
        player.infected = false;
        consecutiveStayTurns = 0;

        if (checkWinner(player)) return;

        nextTurn();
        return;
      }

      const tile = getTile(player.x, player.y);

      handleTowerStep(player, tile, false);
      handleInfection(player);

      consecutiveStayTurns++;

      if (checkWinner(player)) return;

      if (consecutiveStayTurns >= players.length * 3) {
        endGame(player, "Game ended because everyone stayed for 3 full rounds with no movement.", true);
        return;
      }

      nextTurn();
    }

    function handleTowerStep(player, tile, justMovedOntoTile) {
      if (tile.type !== "tower") return;

      if (tile.owner === null) {
        tile.owner = player.id;
        tile.level = 1;
        tile.ownerProgress = 0;
        tile.invaderId = null;
        tile.invaderProgress = 0;
        player.points += pointsForTowerLevel(tile.level);
        return;
      }

      if (tile.owner === player.id) {
        tile.invaderId = null;
        tile.invaderProgress = 0;

        if (justMovedOntoTile) return;
        if (tile.level >= MAX_TOWER_LEVEL) return;

        tile.ownerProgress++;

        if (tile.ownerProgress >= tile.level) {
          tile.level++;
          tile.ownerProgress = 0;
          player.points += pointsForTowerLevel(tile.level);
        }

        return;
      }

      tile.ownerProgress = 0;

      if (tile.invaderId !== player.id) {
        tile.invaderId = player.id;
        tile.invaderProgress = 0;
      }

      tile.invaderProgress++;

      if (tile.invaderProgress >= 5) {
        tile.owner = player.id;
        tile.invaderId = null;
        tile.invaderProgress = 0;
        tile.ownerProgress = 0;
        player.points += pointsForTowerLevel(tile.level);
      }
    }

    function handleInfection(player) {
      if (!TWO_PLAYER_MODE || !gasActive) return;

      const key = tileKey(player.x, player.y);

      if (!infectedTiles.has(key)) return;

      if (gasOrigin && player.x === gasOrigin.x && player.y === gasOrigin.y) return;

      player.infected = true;
    }

    function expandGas() {
      if (!TWO_PLAYER_MODE || !gasActive) return;

      gasRound++;

      let expansions = 1;

      if (gasRound === 3 || gasRound === 4) {
        expansions = 2;
      }

      if (gasRound === 5) {
        expansions = 3;
      }

      if (gasRound > 5) {
        return;
      }

      for (let i = 0; i < expansions; i++) {
        const possible = [];

        infectedTiles.forEach(key => {
          const [x, y] = key.split(",").map(Number);

          for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
              if (dx === 0 && dy === 0) continue;

              const nx = x + dx;
              const ny = y + dy;

              if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE) continue;

              const newKey = tileKey(nx, ny);

              if (!infectedTiles.has(newKey)) {
                possible.push(newKey);
              }
            }
          }
        });

        if (possible.length) {
          const pick = possible[Math.floor(Math.random() * possible.length)];
          infectedTiles.add(pick);

          const [px, py] = pick.split(",").map(Number);
          const tile = getTile(px, py);

          if (tile) {
            tile.revealed = true;
          }
        }
      }

      players.forEach(player => handleInfection(player));
    }

    function teleportPlayer(player) {
      let attempts = 0;

      while (attempts < 1000) {
        attempts++;

        const x = Math.floor(Math.random() * SIZE);
        const y = Math.floor(Math.random() * SIZE);

        if (gasOrigin && x === gasOrigin.x && y === gasOrigin.y) continue;

        player.x = x;
        player.y = y;

        const tile = getTile(x, y);

        if (tile && !tile.revealed) {
          tile.revealed = true;
          player.points += REVEAL_POINTS;

          if (TWO_PLAYER_MODE && tile.type === "gas" && !gasActive) {
            gasActive = true;
            gasOrigin = { x: tile.x, y: tile.y };
            infectedTiles.add(tileKey(tile.x, tile.y));
          }
        }

        if (tile) {
          handleTowerStep(player, tile, true);
        }

        handleInfection(player);
        return;
      }
    }

    function pointsForTowerLevel(level) {
      return Math.floor(50 * Math.pow(1.6, level - 1));
    }

    function checkWinner(player) {
      const ownedTowers = countOwnedTowers(player.id);

      if (player.points >= POINTS_TO_WIN) {
        endGame(player, `${player.name} reached ${POINTS_TO_WIN} points.`, false);
        return true;
      }

      if (USE_TOWER_WIN && ownedTowers >= TOWERS_TO_WIN) {
        endGame(player, `${player.name} owns ${ownedTowers} of ${TOWER_COUNT} towers.`, false);
        return true;
      }

      return false;
    }

    function endGame(winner, reason, stalemate) {
      gameEnded = true;
      finalWinnerId = stalemate ? getRanking()[0].id : winner.id;
      render();

      const finalWinner = players.find(p => p.id === finalWinnerId);

      document.getElementById("winnerTitle").textContent = `${finalWinner.name} Wins!`;
      document.getElementById("winnerReason").textContent = reason;

      const rankingBox = document.getElementById("finalRanking");
      rankingBox.innerHTML = "";

      getRanking().forEach((player, index) => {
        const div = document.createElement("div");
        div.className = "rank-row";
        div.style.borderColor = player.color;

        div.innerHTML = `
          <strong>#${index + 1} ${player.name}</strong><br>
          Points: ${player.points}<br>
          Towers Owned: ${countOwnedTowers(player.id)}<br>
          Highest Tower: Level ${highestTowerLevel(player.id)}
        `;

        rankingBox.appendChild(div);
      });

      document.getElementById("gameOver").style.display = "grid";
    }

    function getRanking() {
      return [...players].sort((a, b) => {
        if (finalWinnerId !== null) {
          if (a.id === finalWinnerId) return -1;
          if (b.id === finalWinnerId) return 1;
        }

        if (b.points !== a.points) return b.points - a.points;

        if (countOwnedTowers(b.id) !== countOwnedTowers(a.id)) {
          return countOwnedTowers(b.id) - countOwnedTowers(a.id);
        }

        return highestTowerLevel(b.id) - highestTowerLevel(a.id);
      });
    }

    function countOwnedTowers(playerId) {
      return tiles.filter(tile => tile.type === "tower" && tile.owner === playerId).length;
    }

    function highestTowerLevel(playerId) {
      const owned = tiles.filter(tile => tile.type === "tower" && tile.owner === playerId);
      if (!owned.length) return 0;
      return Math.max(...owned.map(tile => tile.level));
    }

    function getTowerProgressPercent(tile) {
      if (tile.owner === null) return 0;

      if (tile.invaderId !== null) {
        return Math.min(100, (tile.invaderProgress / 5) * 100);
      }

      if (tile.level >= MAX_TOWER_LEVEL) return 100;

      return Math.min(100, (tile.ownerProgress / tile.level) * 100);
    }

    function nextTurn() {
      currentPlayer++;

      if (currentPlayer >= players.length) {
        currentPlayer = 0;
        fullRoundNumber++;
        expandGas();
      }

      render();
    }

    function toggleSecretPanel() {
      const panel = document.getElementById("secretPanel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
      renderSecretList();
    }

    function addSecretPlayer() {
      const input = document.getElementById("secretNameInput");
      const name = input.value.trim();

      if (!name) return;

      const existsInGame = players.length === 0 || players.some(player => player.name === name);
      if (!existsInGame) {
        input.value = "";
        return;
      }

      if (!secretPlayerNames.includes(name) && secretPlayerNames.length < MAX_SECRET_PLAYERS) {
        secretPlayerNames.push(name);
      }

      input.value = "";
      renderSecretList();
    }

    function clearSecretPlayers() {
      secretPlayerNames = [];
      renderSecretList();
    }

    function isSecretPlayer(name) {
      return secretPlayerNames.includes(name);
    }

    function renderSecretList() {
      const list = document.getElementById("secretList");
      if (!list) return;

      if (secretPlayerNames.length === 0) {
        list.textContent = "No boosted players yet.";
        return;
      }

      list.textContent = "Boosted: " + secretPlayerNames.join(", ");
    }

    function hideGameOver() {
      document.getElementById("gameOver").style.display = "none";
    }

    function isAdjacent(x1, y1, x2, y2) {
      return Math.abs(x1 - x2) + Math.abs(y1 - y2) === 1;
    }

    function getTile(x, y) {
      return tiles.find(tile => tile.x === x && tile.y === y);
    }

    function tileKey(x, y) {
      return `${x},${y}`;
    }

    function manhattan(a, b) {
      return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    function resetGame() {
      tiles = [];
      players = [];
      currentPlayer = 0;
      gameEnded = false;
      finalWinnerId = null;
      consecutiveStayTurns = 0;
      resetPressCount = 0;
      secretPlayerNames = [];

      gasOrigin = null;
      gasActive = false;
      infectedTiles = new Set();
      gasRound = 0;
      fullRoundNumber = 1;

      SIZE = 8;
      TOWER_COUNT = 7;
      POINTS_TO_WIN = 5000;
      USE_TOWER_WIN = true;
      TWO_PLAYER_MODE = false;

      const board = document.getElementById("board");
      board.style.gridTemplateColumns = "repeat(8, 1fr)";
      board.style.gridTemplateRows = "repeat(8, 1fr)";

      document.getElementById("board").innerHTML = "";
      document.getElementById("scores").innerHTML = "";
      document.getElementById("info").textContent = "Name players, pick colors, and start.";
      document.getElementById("gameNote").textContent =
        "Reveal hidden tiles for 10 points. First to 5000 points or 4 towers wins. Arrow keys move. S stays. Press R 5 times to reset.";
      document.getElementById("gameOver").style.display = "none";
      document.getElementById("setupCard").style.display = "block";
      document.getElementById("secretPanel").style.display = "none";

      buildPlayerInputs();
      renderSecretList();
    }

    document.addEventListener("keydown", function(event) {
  if (!state || state.status !== "playing" || !isMyTurn()) return;

  const key = event.key.toLowerCase();

  if (
    key === "arrowup" ||
    key === "arrowdown" ||
    key === "arrowleft" ||
    key === "arrowright" ||
    key === "s"
  ) {
    event.preventDefault();
  }

  const player = state.players[state.currentPlayer];

  if (key === "arrowup") moveTo(player.x, player.y - 1);
  if (key === "arrowdown") moveTo(player.x, player.y + 1);
  if (key === "arrowleft") moveTo(player.x - 1, player.y);
  if (key === "arrowright") moveTo(player.x + 1, player.y);
  if (key === "s") stayTurn();
});

    function confirmReset() {
      const confirmed = confirm("Are you sure you'd like to reset?");
      if (confirmed) {
        resetGame();
      }
    }
  </script>
</body>
